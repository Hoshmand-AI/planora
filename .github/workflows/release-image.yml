# Publishes the RunF9 container image used by private deployments (public/deploy/*):
#   ghcr.io/hoshmand-ai/runf9:<version> and :latest, with an SBOM and build provenance.
# Runs on a version tag (v1.2.3) or by hand. The package is private by default on GitHub; make it
# public (Package settings > Change visibility) or give each customer a read token.
name: Release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag for the image (e.g. 1.0.0)
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/hoshmand-ai/runf9:${{ steps.v.outputs.version }}
            ghcr.io/hoshmand-ai/runf9:latest
          labels: org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/hoshmand-ai/runf9
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
