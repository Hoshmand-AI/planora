name: Production uptime

# Every 15 minutes: production health (database, schema), sign-in page and security headers.
# A failure opens an "incident" issue (repository watchers are notified); recovery closes it.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.PRODUCTION_URL || 'https://planora-chi.vercel.app' }}
    steps:
      - id: probe
        continue-on-error: true
        run: |
          set -e
          health=$(curl -sS --max-time 20 -w '\n%{http_code}' "$URL/api/health")
          code=$(echo "$health" | tail -n1); body=$(echo "$health" | head -n -1)
          echo "health $code $body"
          [ "$code" = "200" ] && echo "$body" | grep -q '"status":"ok"'
          auth=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$URL/auth")
          echo "auth page $auth"; [ "$auth" = "200" ]
          curl -sSI --max-time 20 "$URL/" | grep -qi '^content-security-policy:'
      - uses: actions/github-script@v9
        with:
          script: |
            const failed = '${{ steps.probe.outcome }}' !== 'success'
            const title = 'Production health check failing'
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'incident' })
            const existing = open.find(i => i.title === title)
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (failed && !existing) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['incident'],
                body: `The production probe of ${process.env.URL} failed at ${new Date().toISOString()}.\n\nRun: ${run}\n\nFollow docs/operations/INCIDENT-RESPONSE.md. Rollback: Vercel → Deployments → Instant Rollback.` })
            } else if (failed) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Still failing at ${new Date().toISOString()} — ${run}` })
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Recovered at ${new Date().toISOString()} — ${run}` })
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' })
            }
      - if: steps.probe.outcome != 'success'
        run: exit 1
